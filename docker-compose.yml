version: "3.9"

services:

  web:
    image: nginx
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./ssl/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - cliente
      - servidor
    networks:
      - default

  cliente:
    build:
      context: ./cliente
      dockerfile: Dockerfile
    container_name: cliente_trasversal
    networks:
      - default

  servidor:
    build:
      context: ./Servidor
      dockerfile: Dockerfile
    container_name: servidor_trasversal
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://contMySQL:3306/PASTELERIA
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
    volumes:
      - ./Servidor/uploads:/app/uploads
    networks:
      - default

networks:
  default:
    external:
      name: trasversal_net
