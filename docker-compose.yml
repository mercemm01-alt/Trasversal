services:
  web:
    image: nginx
    ports:
      - 81:81
      - 80:80
      - 443:443
    volumes:
      - ./Liga:/usr/share/nginx/html:ro
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./ssl/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - api_liga
      - api


  api_liga:
    build: 
      context: ./Liga
      dockerfile: Dockerfile2


  api:
    build: 
      context: .
      dockerfile: Dockerfile
    #ports:
      #- 8080:80
    env_file: ".env"
    environment:
      MONGO_USER: ${USUARIO_MONGO}
      MONGO_PASSWORD: ${CONTRASENA_MONGO}
      MONGOHOST: db
    depends_on:
      - db

  db:
    image: mongo
    env_file: ".env"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USUARIO_MONGO}
      MONGO_INITDB_ROOT_PASSWORD: ${CONTRASENA_MONGO}
      MONGO_INITDB_DATABASE: mydatabase
    #volumes:
    #  - ./db:/data/db
